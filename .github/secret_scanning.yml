# Paths that hold only made-up test literals (fixtures, test data, test
# configs, doc examples). Keep .gitleaks.toml in step.
paths-ignore:
  - "**/fixtures/**"
  - "**/testdata/**"
  - "**/Test*/*.yml"
  - "tests/*.ini"
  - "tests/*.ini.tmpl"
  - "integrations/*.ini"
  - "integrations/*.ini.tmpl"
  - "tests/integration/ssh-signing-key"
  - "integrations/private-testing.key"
  - "routers/private/tests/**"
  - "docs/content/**"
