name: spovedBuild

# Runs the CI of a pull request or of a push to develop in the public
# InfiniteSpoved/spovedBuild repository and shows the logs of its failed jobs
# here. Only this small job runs in this repository; ci.yml runs the whole CI
# here by hand.
#
# spovedBuild reports the result as the commit status "CI success" (the check
# to require) and keeps each job's log only as an encrypted artifact. This job
# makes a throwaway key pair, sends the public half with the dispatch, and
# decrypts the logs of failed jobs with the private half, which never leaves
# the runner.
#
# A pull request from a fork gets no secret (and is never dispatched, even if it
# did): the job ends at once with a notice, and no "CI success" status is set, so
# the pull request cannot be merged yet. A maintainer reads the change and pushes
# the branch to this repository (see CONTRIBUTING.md): spovedBuild then tests the
# same commit and the status shows on the fork's pull request too.
#
# Setup: secret SPOVEDBUILD_DISPATCH_TOKEN, a fine-grained token for
# InfiniteSpoved/spovedBuild with Contents: read and write (to send the
# dispatch) and Actions: read (to fetch the logs).

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: spovedbuild-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  ci:
    name: spovedBuild
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUILD_REPO: InfiniteSpoved/spovedBuild
      BUILD_TOKEN: ${{ secrets.SPOVEDBUILD_DISPATCH_TOKEN }}
      # a missing head repository (deleted fork) counts as a fork
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      # a push tests the pushed commit itself
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Start the run
        id: start
        run: |
          if [ "$FORK" = true ] || { [ -z "$BUILD_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; }; then
            msg="No full CI ran for this pull request, because it has no access to the secret that starts it. A maintainer has to read the change and push the branch to this repository to run it."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BUILD_TOKEN" ]; then
            echo "::error::Secret SPOVEDBUILD_DISPATCH_TOKEN is not set"
            exit 1
          fi
          # a status from an earlier push of the same commit is older than this
          echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase '' --quick-gen-key ci-log future-default default 1d
          # the merge commit, like a pull_request run; the status goes on the head commit
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg pr "$PR" --arg sha "$GITHUB_SHA" --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" --arg key "$(gpg --export ci-log | base64 -w0)" \
            '{event_type: "ci", client_payload: {repo: $repo, pr: $pr, sha: $sha, head_sha: $head, base_sha: $base,
              log_key: $key, full: true}}' > "$RUNNER_TEMP/payload.json"
          curl -fsS -X POST -H "Authorization: Bearer $BUILD_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$BUILD_REPO/dispatches" -d @"$RUNNER_TEMP/payload.json"
          echo "started=true" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          # the plan skips the unit tests when only files they can't depend on changed since the base
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Wait for the result
        id: wait
        if: steps.start.outputs.started == 'true'
        run: |
          # spovedBuild's plan marks the head commit "CI success: pending" with a link to its run
          while :; do
            sleep 30
            status=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" |
              jq -c --arg t "$STARTED" '[.[] | select(.context == "CI success" and .created_at >= $t)] | first // empty')
            [ -n "$status" ] || continue
            state=$(jq -r .state <<< "$status")
            [ "$state" = pending ] && continue
            url=$(jq -r .target_url <<< "$status")
            echo "spovedBuild: $state, $url"
            echo "run=${url##*/}" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            break
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Show the failed jobs' logs
        if: steps.start.outputs.started == 'true' && steps.wait.outputs.state != 'success'
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          token=$BUILD_TOKEN
          api="https://api.github.com/repos/$BUILD_REPO/actions/runs/$RUN"
          # job N's log is the artifact log-N; the plan's is log-plan
          curl -fsS -H "Authorization: Bearer $token" "$api/jobs?per_page=100" |
            jq -r '.jobs[] | select(.conclusion == "failure") | .name' |
            sed -n 's/^Job \([0-9]*\)$/log-\1/p; s/^Plan$/log-plan/p' > "$RUNNER_TEMP/failed"
          artifacts=$(curl -fsS -H "Authorization: Bearer $token" "$api/artifacts?per_page=100")
          while read -r name; do
            id=$(jq -r --arg n "$name" '[.artifacts[] | select(.name == $n)] | max_by(.created_at) | .id // empty' <<< "$artifacts")
            [ -n "$id" ] || { echo "No $name"; continue; }
            curl -fsSL -H "Authorization: Bearer $token" -o "$RUNNER_TEMP/$name.zip" \
              "https://api.github.com/repos/$BUILD_REPO/actions/artifacts/$id/zip"
            python3 -m zipfile -e "$RUNNER_TEMP/$name.zip" "$RUNNER_TEMP/$name"
            echo "::group::$name"
            if gpg --batch --quiet --decrypt "$RUNNER_TEMP/$name/log.gpg" > "$RUNNER_TEMP/$name.log" 2> /dev/null; then
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              # the test failures, outside the collapsed group
              grep -E '^(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/$name.log" || true
            else
              # encrypted to someone else's key (a run started by hand): theirs to decrypt
              gpg --enarmor < "$RUNNER_TEMP/$name/log.gpg"
              echo "::endgroup::"
            fi
          done < "$RUNNER_TEMP/failed"
          exit 1
        env:
          RUN: ${{ steps.wait.outputs.run }}
