name: Deploy local

# Builds a branch on the self-hosted Proxmox runners and installs it in the long-lived spoved container
# on the same host, which keeps its data across deploys. Runs only on demand: Actions → Deploy local →
# Run workflow. Deploys never overlap; a second one waits for the first.
#
# The container and the deploy key come from contrib/deploy-local/setup.sh, run once on the Proxmox host.
# It prints the three secrets this workflow needs: DEPLOY_LOCAL_HOST, DEPLOY_LOCAL_KNOWN_HOSTS and
# DEPLOY_LOCAL_SSH_KEY. The key can only run spoved-deploy in that container (forced command, no shell),
# which backs up the database, swaps the binary and rolls back if /api/healthz doesn't answer.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy.
        default: develop

concurrency:
  group: deploy-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: proxmox
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # no GitHub cache: the runners share host-wide Go and npm caches (see ci.yml)
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Build
        run: make TAGS='bindata timetzdata sqlite sqlite_unlock_notify' build
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_LOCAL_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_LOCAL_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_LOCAL_SSH_KEY }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Run contrib/deploy-local/setup.sh on the Proxmox host and add the secrets it prints."
            exit 1
          fi
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key"
          # the command is ignored by the forced command, which only logs it
          ssh -i "$dir/key" -o UserKnownHostsFile="$dir/known_hosts" -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o IdentitiesOnly=yes "root@$HOST" "$REF $(git rev-parse --short HEAD)" < gitea
          echo "Deployed \`$REF\` ($(git rev-parse --short HEAD)) to http://$HOST:3000/" >> "$GITHUB_STEP_SUMMARY"
