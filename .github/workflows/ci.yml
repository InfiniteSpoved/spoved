name: CI

# The CI of this repository, on GitHub-hosted runners. What each job does lives
# in .github/ci/job.sh. The last job, "CI success", is the check that gates a
# merge.
#
# Pull requests and pushes to develop run everything. It uses no secret and the
# token is read-only, so pull requests from forks run the same CI (outside
# contributors' runs wait for a maintainer's approval, see CONTRIBUTING.md).
#
# Manual runs take a branch, tag or commit and run the checks and unit tests,
# everything when full is checked; `only` limits a manual run to some stages
# and then reports "CI partial" instead of "CI success".

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test.
        default: develop
      full:
        description: Also run the migration, integration and end-to-end tests (about an hour). Otherwise only the checks and unit tests run.
        type: boolean
        default: false
      run-all-e2e:
        description: Run every end-to-end test, not only those covering the files changed compared with develop.
        type: boolean
        default: true
      only:
        description: Optional comma-separated stages to run (lint, frontend, unit, migrations, integration, e2e), for iterating on a fix. Such a run reports "CI partial", never "CI success".
        default: ''

concurrency:
  # a new push to a pull request cancels its unfinished run
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # the plan compares a pull request with its base
          fetch-depth: 0
          persist-credentials: false
      - name: Plan
        id: plan
        run: .github/ci/job.sh plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
          RUN_ALL_E2E: ${{ inputs.run-all-e2e }}
          ONLY: ${{ inputs.only }}

  run:
    name: ${{ matrix.task }} ${{ matrix.args }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # npm reads from the registry time out now and then on the runners' network
      npm_config_fetch_retries: 5
      # GitHub's cache downloads sometimes stall for the default 10 minutes; treat that as a cache miss sooner
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # commits to fetch, 0 for the full history (with origin/develop)
          fetch-depth: ${{ matrix.depth }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/ms-playwright
          key: tools-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('go.sum', '.golangci.yml', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tools-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('go.sum', '.golangci.yml', 'package-lock.json') }}-
            tools-${{ runner.os }}-${{ matrix.task }}-
      - name: Run
        run: |
          # ARGS is split into words on purpose
          # shellcheck disable=SC2086
          .github/ci/job.sh "$TASK" $ARGS
        env:
          TASK: ${{ matrix.task }}
          ARGS: ${{ matrix.args }}
          RUN_ALL_E2E: ${{ inputs.run-all-e2e }}

  # The single check to require in the merge rules
  ci-success:
    name: ${{ inputs.only && 'CI partial' || 'CI success' }}
    if: always()
    needs: [plan, run]
    runs-on: ubuntu-latest
    steps:
      - name: Report the result
        run: '[ "$FAILED" = false ]'
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
