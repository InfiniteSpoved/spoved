name: CI

# Lint, unit, integration and end-to-end tests for the develop branch and the
# pull requests targeting it. This mirrors the jobs of Forgejo's own
# .forgejo/workflows/testing.yml (which GitHub does not run) using the same
# make targets, on GitHub-hosted runners with SQLite.
#
# main is a mirror of upstream Forgejo and is not tested here.

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run-all-e2e:
        description: Run every end-to-end test instead of only those covering changed files
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Forgejo tests use SQLite unless told otherwise
  TAGS: sqlite sqlite_unlock_notify
  TEST_TAGS: sqlite sqlite_unlock_notify

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      # lint-renovate needs node_modules
      - run: make deps-frontend
      # golangci-lint, go vet, locale, editorconfig, swagger and format checks, then a build
      - run: make pr-go

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: make deps-frontend
      - run: make lint-frontend
      - run: make checks-frontend
      - run: make test-frontend
      - run: make frontend
      - name: Keep the frontend build for the end-to-end tests
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: public/assets
          retention-days: 1

  test-unit:
    name: Unit tests
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make test-backend
        env:
          RACE_ENABLED: 'true'
      - name: Check the tests left the source tree untouched
        run: make test-check

  test-sqlite:
    name: Integration tests (SQLite)
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Migration tests
        run: make test-sqlite-migration
        env:
          USE_REPO_TEST_DIR: 1
      - name: Integration tests
        run: make test-sqlite
        env:
          USE_REPO_TEST_DIR: 1

  test-e2e:
    name: End-to-end tests (${{ matrix.browser }})
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Forgejo's own CI runs the end-to-end tests in Firefox, which its
        # timing-sensitive tests are tuned for. Add chromium here to test both.
        browser: [firefox]
    steps:
      - uses: actions/checkout@v5
        with:
          # the full history is needed to list the files a pull request changes
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore the frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: public/assets
      - run: make deps-frontend
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Select the tests to run
        id: select
        run: |
          # On pull requests only the tests whose `@watch` patterns match the
          # changed files run (see tests/e2e/changes.go); pushes to develop and
          # manual runs execute all of them.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # tests/e2e/changes.go splits the list on a literal "\n"
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | awk 'NR > 1 {printf "\\n"} {printf "%s", $0}')
            echo "Changed files:"
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            echo "changed-files=$changed" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.run-all-e2e }}" = "true" ]; then
            echo "run-all=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the end-to-end test server
        run: make e2e.sqlite.test generate-ini-sqlite
      - name: End-to-end tests
        run: |
          if [ -n "$RUN_ALL_E2E" ]; then export RUN_ALL=1; fi
          if [ -n "$CHANGED_E2E_FILES" ]; then export CHANGED_FILES="$CHANGED_E2E_FILES"; fi
          PROJECT_ROOT="$PWD" PROJECT_CONF=tests/sqlite.ini ./e2e.sqlite.test -test.run TestE2e
        env:
          DISPLAY: ''
          USE_REPO_TEST_DIR: 1
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
          RUN_ALL_E2E: ${{ steps.select.outputs.run-all }}
          CHANGED_E2E_FILES: ${{ steps.select.outputs.changed-files }}
      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts-${{ matrix.browser }}
          path: tests/e2e/test-artifacts/
          retention-days: 7

  # A single check to require in branch protection rules
  ci-success:
    name: CI success
    if: always()
    needs: [backend-checks, frontend-checks, test-unit, test-sqlite, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All CI jobs passed"
      - name: Some jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
