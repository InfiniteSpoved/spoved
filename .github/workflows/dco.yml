name: dco

# Checks that every commit of a pull request (merges excluded) has a
# Signed-off-by line; see CONTRIBUTING.md and tools/check-dco.sh.
# Commits made before DCO_START (the day the repository went public) are ignored.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test
        run: tools/check-dco_test.sh
      - name: Check the sign-offs
        run: tools/check-dco.sh origin/develop
        env:
          DCO_START: '2026-10-19'
