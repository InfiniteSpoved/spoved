name: Release image

# Builds the container image from Dockerfile.rootless and pushes it to the
# GitHub Container Registry as ghcr.io/githatorg/githat. It runs only on demand:
# Actions → Release image → Run workflow.
#
# Tags: sha-<commit> always; <version> and latest when a version is given.
# The package is private like the repository. Pull it with a token that has
# read:packages, or import it into Azure Container Registry:
#   az acr import --name <registry> --source ghcr.io/githatorg/githat:<tag> \
#     --username <github user> --password <token>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        default: develop
      version:
        description: Release version, semver (e.g. 16.0.0-githat.1). Also tags the image as latest. Leave empty for a test build tagged with the commit only.
        default: ''

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # The build context includes .git, so keep the token out of it.
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::The version must be semver, e.g. 16.0.0-githat.1"
              exit 1
            fi
            # The Makefile takes the version from this file instead of git tags.
            echo "$VERSION" > VERSION
          fi
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE_VERSION=${{ inputs.version }}
          sbom: true
          provenance: mode=max
