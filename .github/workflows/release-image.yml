name: Release image

# Builds the container image from Dockerfile.rootless and pushes it to the
# GitHub Container Registry as ghcr.io/githatorg/githat. It runs only on demand:
# Actions → Release image → Run workflow.
#
# Tags: sha-<commit> always. <version> and latest are added to the same digest
# only when a version is given and the Trivy scan finds nothing at fail-on.
# Accepted risks go in .trivyignore; the run prints them in its summary.
# The package is private like the repository. Pull it with a token that has
# read:packages, or import it into Azure Container Registry:
#   az acr import --name <registry> --source ghcr.io/githatorg/githat:<tag> \
#     --username <github user> --password <token>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        default: develop
      version:
        description: Release version, semver (e.g. 16.0.0-githat.1). Also tags the image as latest. Leave empty for a test build tagged with the commit only.
        default: ''
      fail-on:
        description: Fail the run on fixable vulnerabilities of these severities.
        type: choice
        options:
          - CRITICAL
          - CRITICAL,HIGH
          - CRITICAL,HIGH,MEDIUM,LOW
        default: CRITICAL

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # The build context includes .git, so keep the token out of it.
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::The version must be semver, e.g. 16.0.0-githat.1"
              exit 1
            fi
            # The Makefile takes the version from this file instead of git tags.
            echo "$VERSION" > VERSION
          fi
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64
          push: true
          # The release tags in meta only set the labels; they are added after the scan.
          tags: ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE_VERSION=${{ inputs.version }}
          sbom: true
          provenance: mode=max

      # Trivy's GitHub Actions were hijacked in March 2026 (GHSA-69fq-xp46-6x23),
      # so run the release binary pinned by checksum. Before bumping, verify:
      #   cosign verify-blob --bundle <tarball>.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v<version> <tarball>
      - name: Scan the image
        id: scan
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          IMAGE: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # The summary prints this file, so a symlink could leak e.g. the docker login.
          if [ -L .trivyignore ]; then echo "::error::.trivyignore must be a regular file"; exit 1; fi
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          mkdir "$RUNNER_TEMP/report"
          # Trivy reads .trivyignore from here, if present, and the registry login from docker's config.
          "$RUNNER_TEMP/trivy" image --image-src remote --platform linux/amd64 --scanners vuln --pkg-types os,library \
            --ignore-unfixed --format json --output "$RUNNER_TEMP/report/trivy.json" "$IMAGE"
          "$RUNNER_TEMP/trivy" convert --format table --output "$RUNNER_TEMP/report/trivy.txt" "$RUNNER_TEMP/report/trivy.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: trivy-report-sha-${{ steps.version.outputs.sha }}
          path: ${{ runner.temp }}/report
          retention-days: 90

      - name: Check the scan
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo "### Trivy scan, failing on $FAIL_ON"
            jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("- \(.[0]): \(length)") | if . == [] then "No fixable vulnerabilities." else .[] end' "$RUNNER_TEMP/report/trivy.json"
            echo '### Ignored (.trivyignore)'
            if [ -f .trivyignore ]; then
              # Escaped so the file's content cannot close the block or add markup.
              echo '<pre>'
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' .trivyignore
              echo '</pre>'
            else
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ! "$RUNNER_TEMP/trivy" convert --format table --severity "$FAIL_ON" --exit-code 1 "$RUNNER_TEMP/report/trivy.json"; then
            echo "**Failed:** fixable $FAIL_ON vulnerabilities found. Only sha-${SHA} was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Add the release tags
        if: inputs.version != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        # Copies the scanned index, attestations included; the digest stays the same.
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
