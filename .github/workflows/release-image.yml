name: Release image

# Builds the container image from Dockerfile.rootless and pushes it to the
# GitHub Container Registry as ghcr.io/<owner>/<repo>, lowercased from the
# repository name (today ghcr.io/githatorg/githat). It runs only on demand:
# Actions → Release image → Run workflow.
#
# Tags: sha-<commit> always. <version> and latest are added to the same digest
# only when a version is given and the Trivy scan finds nothing at fail-on.
# Accepted risks go in .trivyignore; the run prints them in its summary.
# The package is private like the repository. Pull it with a token that has
# read:packages, or import it into Azure Container Registry:
#   az acr import --name <registry> --source ghcr.io/<owner>/<repo>:<tag> \
#     --username <github user> --password <token>
#
# Azure Container Registry push (push-to-acr, needs a version): the acr job
# copies the scanned digest, attestations included, to <ACR_NAME>.azurecr.io/<repo>
# with the same tags. It logs in with GitHub OIDC, so no secret is stored, and
# runs only after the image job passed. Set up once, outside this workflow:
#   1. A user-assigned managed identity (or app registration) with the role
#      AcrPush on the registry only.
#   2. A federated credential on it: issuer https://token.actions.githubusercontent.com,
#      subject repo:GitHatOrg/GitHat:environment:release, audience api://AzureADTokenExchange.
#      Renaming or moving the repository changes the subject; update it then.
#   3. Repository variable ACR_NAME (registry name, not the login server). Unset
#      means push-to-acr does nothing.
#   4. Variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID in the
#      `release` environment. None of them is secret.
#   5. Required reviewers on the `release` environment: otherwise anyone who can
#      run this workflow can push any ref to ACR. Deployment-branch rules only
#      check the branch the workflow runs from, not `ref`, so they are an extra.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build.
        default: develop
      version:
        description: Release version, semver (e.g. 16.0.0-codehat.1). Also tags the image as latest. Leave empty for a test build tagged with the commit only.
        default: ''
      fail-on:
        description: Fail the run on fixable vulnerabilities of these severities.
        type: choice
        options:
          - CRITICAL
          - CRITICAL,HIGH
          - CRITICAL,HIGH,MEDIUM,LOW
        default: CRITICAL
      push-to-acr:
        description: Also copy the scanned image to Azure Container Registry. Needs a version, the repository variable ACR_NAME and the release environment.
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          # The build context includes .git, so keep the token out of it.
          persist-credentials: false

      - name: Set the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          PUSH_ACR: ${{ inputs.push-to-acr }}
        run: |
          if [ "$PUSH_ACR" = true ] && [ -z "$VERSION" ]; then
            echo "::error::push-to-acr needs a version"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::The version must be semver, e.g. 16.0.0-codehat.1"
              exit 1
            fi
            # The Makefile takes the version from this file instead of git tags.
            echo "$VERSION" > VERSION
          fi
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64
          push: true
          # The release tags in meta only set the labels; they are added after the scan.
          tags: ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE_VERSION=${{ inputs.version }}
          sbom: true
          provenance: mode=max

      # Trivy's GitHub Actions were hijacked in March 2026 (GHSA-69fq-xp46-6x23),
      # so run the release binary pinned by checksum. Before bumping, verify:
      #   cosign verify-blob --bundle <tarball>.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v<version> <tarball>
      - name: Scan the image
        id: scan
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          IMAGE: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # The summary prints this file, so a symlink could leak e.g. the docker login.
          if [ -L .trivyignore ]; then echo "::error::.trivyignore must be a regular file"; exit 1; fi
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          mkdir "$RUNNER_TEMP/report"
          # Trivy reads .trivyignore from here, if present, and the registry login from docker's config.
          "$RUNNER_TEMP/trivy" image --image-src remote --platform linux/amd64 --scanners vuln --pkg-types os,library \
            --ignore-unfixed --format json --output "$RUNNER_TEMP/report/trivy.json" "$IMAGE"
          "$RUNNER_TEMP/trivy" convert --format table --output "$RUNNER_TEMP/report/trivy.txt" "$RUNNER_TEMP/report/trivy.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        with:
          name: trivy-report-sha-${{ steps.version.outputs.sha }}
          path: ${{ runner.temp }}/report
          retention-days: 90

      - name: Check the scan
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo "### Trivy scan, failing on $FAIL_ON"
            jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("- \(.[0]): \(length)") | if . == [] then "No fixable vulnerabilities." else .[] end' "$RUNNER_TEMP/report/trivy.json"
            echo '### Ignored (.trivyignore)'
            if [ -f .trivyignore ]; then
              # Escaped so the file's content cannot close the block or add markup.
              echo '<pre>'
              sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' .trivyignore
              echo '</pre>'
            else
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if ! "$RUNNER_TEMP/trivy" convert --format table --severity "$FAIL_ON" --exit-code 1 "$RUNNER_TEMP/report/trivy.json"; then
            echo "**Failed:** fixable $FAIL_ON vulnerabilities found. Only sha-${SHA} was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Add the release tags
        if: inputs.version != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        # Copies the scanned index, attestations included; the digest stays the same.
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  # Separate from the image job: that one builds the ref's code, so it must never
  # hold the OIDC token or the release environment. This job checks out nothing.
  acr:
    needs: image
    if: ${{ inputs.push-to-acr && vars.ACR_NAME != '' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: none
      packages: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      DIGEST: ${{ needs.image.outputs.digest }}
      SHA: ${{ needs.image.outputs.sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$ACR_NAME" =~ ^[a-zA-Z0-9]{5,50}$ ]] || { echo "::error::ACR_NAME must be 5-50 letters or digits"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad image digest"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::Bad commit sha"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo "::error::The version must be semver"; exit 1; }

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Copy the image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          SRC="ghcr.io/${GITHUB_REPOSITORY,,}"
          DST="${ACR_NAME,,}.azurecr.io/${GITHUB_REPOSITORY#*/}"
          DST="${DST,,}"
          # Copies the scanned index, attestations included, without changing it.
          docker buildx imagetools create --tag "$DST:sha-$SHA" --tag "$DST:$VERSION" --tag "$DST:latest" "$SRC@$DIGEST"
          for tag in "sha-$SHA" "$VERSION" latest; do
            got=$(docker buildx imagetools inspect "$DST:$tag" --format '{{.Manifest.Digest}}')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$DST:$tag has digest $got, expected $DIGEST"
              exit 1
            fi
          done
          {
            echo "### Pushed to ACR"
            echo "- Source: \`$SRC@$DIGEST\`"
            echo "- Copy: \`$DST@$DIGEST\`"
            echo "- Tags: \`sha-$SHA\`, \`$VERSION\`, \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
